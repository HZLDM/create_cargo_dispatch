modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = ""

[[mixins]]
config = "create_cargo_dispatch.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "HZLDM"
description = '''
A mod for the Create ecosystem about freight contracts and multi-modal transport companies.
Construct dedicated freight terminals, generate delivery orders by linking various station types,
pilot vehicles to haul cargo crates for freight credits, and expand your integrated transport business.
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# 硬依赖：必须存在才能运行
# Sable：物理引擎，货箱物理化装配依赖此 mod
[[dependencies.${mod_id}]]
modId = "sable"
type = "required"
versionRange = "[2.0,)"
ordering = "AFTER"
side = "BOTH"

# 机械动力：货物方块视觉与 ItemVault 一致，且使用眼镜查看信息
[[dependencies.${mod_id}]]
modId = "create"
type = "required"
versionRange = "[6.0,)"
ordering = "AFTER"
side = "BOTH"

# Create Simulated（机械动力：航空学）：
#  · 用户要求黏着器方块仍然用航空学的 Merging Glue（方块本体、模型、SubLevel 合并原生逻辑都走航空学）
#  · CCD 只 Mixin 黏着器 onPlace 前置步骤，做两件 CCD 专属的事：
#      ① 把未物理化的完整 3×3×9 货箱先装配成 SubLevel（让航空学 MergingGlue 能命中两侧 SubLevel）
#      ② 把两侧 CCD 货箱严格按 3×3×9 尺寸对齐到横截面底部中心（用户要求的「中心偏下」）
[[dependencies.${mod_id}]]
modId = "simulated"
type = "required"
versionRange = "[1.3.0,)"
ordering = "AFTER"
side = "BOTH"

# 软依赖：加载在后面，不存在时不影响
# Xaero's Minimap：用于在接单后自动生成终点路径点
[[dependencies.${mod_id}]]
modId = "xaerominimap"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "CLIENT"

# Jade：用于查看货物信息（玉）
[[dependencies.${mod_id}]]
modId = "jade"
type = "optional"
versionRange = "[0,)"
ordering = "AFTER"
side = "BOTH"
